name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew build --no-daemon --console=plain
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --verify-tag \
            --title "Inventory Expanded ${GITHUB_REF_NAME#v}" \
            --notes "Port no oficial para Minecraft 26.3 (Fabric). Necesita Java 25, Fabric Loader 0.20.1+ y Fabric API."
